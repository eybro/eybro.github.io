<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>erik råberg</title>

  <style>
    body {
      margin: 0;
      font-family: "Courier New", monospace;
      color: white;
      background: black;
      overflow-x: hidden;
    }

    /* Retro star background */
    .stars {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #4e7bff 2px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.35;
      z-index: -1;
    }

    h1 {
      text-align: center;
      font-size: 3rem;
      letter-spacing: 0.5rem;
      margin-top: 80px;
    }

    .mountain {
      color: #7ca6ff;
      font-size: 1rem;
      text-align: center;
      margin-top: 30px;
      opacity: 0.9;
      position: relative;
    }

    /* Skier */
    .skier {
  position: absolute;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  color: #ffdf7f;
  font-size: 2rem;
  animation: ski-zigzag 6s linear infinite;
  pointer-events: none;
}

@keyframes ski-zigzag {
    0%   { transform: translate(-50%, 0); }
    20%  { transform: translate(-30%, 25px); }
    40%  { transform: translate(-60%, 50px); }
    60%  { transform: translate(-20%, 70px); }
    80%  { transform: translate(-70%, 80px); }
    100% { transform: translate(-10%, 85px); }
  }

    .info {
      text-align: center;
      font-size: 1rem;
      line-height: 1.6;
      margin-top: 40px;
    }

    a {
      color: #7ca6ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .icon-link {
      color: white;
      text-decoration: none;
      font-size: 1rem;
    }

    .icon-link svg {
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
</head>

<body>
  <div class="stars"></div>

  <h1>erik råberg</h1>

  <div class="mountain">

    <!-- SKIER ANIMATION -->
    <pre class="skier">⛷️</pre>

<pre>
        /\\\\\\
       /  \\   \\
      /    \\    \\
     /      \\     \\
    /        \\       \\
</pre>
  </div>

  <div class="box"></div>

  <div class="info">
    St. Gallen, Switzerland<br><br>

    <a class="icon-link" href="https://github.com/eybro" target="_blank">
      <img src="github.svg" width="20" style="vertical-align: middle; margin-right: 8px;">
      github.com/eybro
    </a><br><br>

   <a class="icon-link" href="https://www.instagram.com/erikraberg" target="_blank">
      <img src="instagram.svg" width="20" style="vertical-align: middle; margin-right: 8px;">
      @erikraberg
    </a><br><br>

    <a class="icon-link" href="https://pubquery.se" target="_blank">
      pubquery.se
    </a><br><br>
  </div>
</body>
</html>
